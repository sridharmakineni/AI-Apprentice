name: publish to dev.to

# dev.to is the only one of the three channels with a usable write API.
# LinkedIn and Facebook stay manual -- the week-complete issue tracks them.

on:
  push:
    branches: [main]
    paths: ['books/**/manuscript/chapter-*.md']
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Path to a single chapter to publish'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt

      - name: publish changed chapters
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: python tools/publish_devto.py ${{ inputs.chapter }}

      - name: persist article id map
        run: |
          if ! git diff --quiet .devto-map.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .devto-map.json
            git commit -m "chore: record dev.to article ids"
            git push
          fi
