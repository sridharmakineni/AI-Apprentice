name: publish to dev.to

# dev.to is the only one of the three channels with a usable write API.
# LinkedIn and Facebook stay manual -- the week-complete issue tracks them.

on:
  push:
    branches: [main]
    paths: ['books/**/manuscript/chapter-*.md']
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Path to a single chapter to publish'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Lifted to job level so steps can test for it. The secrets context is not
      # available in an `if:`, but the env context is.
      DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt

      - name: skip when dev.to is not configured yet
        if: env.DEVTO_API_KEY == ''
        run: |
          echo "### dev.to publish skipped" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No DEVTO_API_KEY secret is set, so there is nothing to publish to." >> $GITHUB_STEP_SUMMARY
          echo "Add one under Settings → Secrets and variables → Actions when you are" >> $GITHUB_STEP_SUMMARY
          echo "ready to start posting chapters." >> $GITHUB_STEP_SUMMARY

      - name: publish changed chapters
        if: env.DEVTO_API_KEY != ''
        run: python tools/publish_devto.py ${{ inputs.chapter }}

      - name: persist article id map
        if: env.DEVTO_API_KEY != ''
        run: |
          if ! git diff --quiet .devto-map.json; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .devto-map.json
            git commit -m "chore: record dev.to article ids"
            git push
          fi
